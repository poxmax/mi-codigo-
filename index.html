<!DOCTYPE html>
<html lang="es-BO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Lucha de Brazos Bolivia | Asociación Oficial - Santa Cruz</title>
<meta name="description" content="Asociación de Lucha de Brazos Bolivia. Organización de eventos, campeonatos y competencias de armwrestling en Santa Cruz de la Sierra, Bolivia.">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Ibarra+Real+Nova:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{
  --c-black:#050608;
  --c-black-2:#0a0c10;
  --c-black-3:#0e1016;
  --c-card:rgba(14,16,22,0.75);
  --c-card-hover:rgba(20,24,32,0.95);
  --c-red:#e6003a;
  --c-red-glow: rgba(230,0,58,0.4);
  --c-gold:#cfa860;
  --c-gold-glow: rgba(207,168,96,0.4);
  --c-white:#ffffff;
  --c-gray:#9fa4b0;
  --c-gray-dark:#3a3f49;
  --c-bo-green:#007a33;
  --c-bo-yellow:#f4d03f;
  --border-glass: rgba(255,255,255,0.06);
  --border-glass-strong: rgba(255,255,255,0.16);
  --sidebar-w: 290px;
  --header-h: 84px;
  --font-display:'Cinzel', serif;
  --font-heading:'Cinzel', serif;
  --font-body:'Ibarra Real Nova', serif;
  --font-ui:'Montserrat', sans-serif;
  --ease: cubic-bezier(.25,.8,.25,1);
  --ease-bounce: cubic-bezier(.175,.885,.32,1.275);
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

html{ scroll-behavior:smooth; }

body{
  background:var(--c-black);
  color:var(--c-white);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.7;
  overflow-x:hidden;
  min-height:100vh;
  position:relative;
}

a{ color:inherit; text-decoration:none; }
ul{ list-style:none; }
img{ max-width:100%; display:block; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea,select{ font-family:var(--font-ui); }

::selection{ background:var(--c-red); color:var(--c-white); }

::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--c-black); }
::-webkit-scrollbar-thumb{ background:var(--border-glass-strong); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:var(--c-gold); }

h1,h2,h3,h4{ font-family:var(--font-heading); font-weight:700; letter-spacing:1px; }

.section-eyebrow{
  display:inline-flex; align-items:center; gap:10px;
  color:var(--c-red); font-family:var(--font-ui);
  text-transform:uppercase; letter-spacing:4px; font-size:.72rem; font-weight:700;
  margin-bottom:12px; text-shadow:0 0 10px var(--c-red-glow);
}
.section-eyebrow::before{
  content:''; width:30px; height:2px; background:var(--c-gold);
  box-shadow:0 0 8px var(--c-gold-glow);
}
.section-title{
  font-family:var(--font-display);
  font-weight:900;
  font-size:clamp(2.2rem,4vw,3rem);
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:16px;
  line-height:1.1;
  background:linear-gradient(90deg,#fff,var(--c-gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  display:inline-block;
  position:relative;
  padding-bottom:14px;
}
.section-title::after{
  content:''; position:absolute; left:0; bottom:0; width:64px; height:4px;
  background:var(--c-red); box-shadow:0 0 12px var(--c-red);
}
.section-title span{
  color:transparent; -webkit-text-stroke:1px var(--c-red);
  background:linear-gradient(90deg,#fff,var(--c-red));
  -webkit-background-clip:text; background-clip:text;
}
.section-sub{
  color:var(--c-gray);
  font-family:var(--font-ui);
  max-width:680px;
  font-size:1rem;
  margin-bottom:44px;
}
.section-head{ margin-bottom:40px; }

.demo-tag{
  display:inline-block; background:rgba(207,168,96,0.12); border:1px solid var(--c-gold);
  color:var(--c-gold); font-size:.62rem; letter-spacing:2px; text-transform:uppercase;
  padding:5px 12px; border-radius:20px; font-family:var(--font-ui); font-weight:700; margin-left:12px;
  vertical-align:middle;
}

#bg-canvas{ position:fixed; inset:0; z-index:0; pointer-events:none; }
.bg-glow{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 900px 600px at 10% -8%, rgba(230,0,58,0.12), transparent 60%),
    radial-gradient(ellipse 800px 600px at 108% 15%, rgba(207,168,96,0.1), transparent 55%),
    radial-gradient(ellipse 700px 700px at 50% 112%, rgba(230,0,58,0.1), transparent 60%);
  opacity:.8;
}
.bg-scanline{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.4) 50%);
  background-size:100% 4px;
  mix-blend-mode:overlay; opacity:.35;
}
.bg-vignette{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  box-shadow: inset 0 0 240px rgba(0,0,0,0.9);
}
.ambient-light{
  position:fixed; top:-20%; left:-10%; width:50vw; height:50vw;
  background:radial-gradient(circle, rgba(230,0,58,0.06) 0%, transparent 70%);
  z-index:1; pointer-events:none;
}
.ambient-light.right{
  top:auto; bottom:-20%; left:auto; right:-10%;
  background:radial-gradient(circle, rgba(207,168,96,0.06) 0%, transparent 70%);
}

.app-shell{ position:relative; z-index:2; display:flex; min-height:100vh; }

.topbar{
  position:fixed; top:0; left:0; right:0; height:var(--header-h);
  z-index:200; display:flex; align-items:center; justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(180deg, rgba(5,6,8,0.96) 0%, rgba(5,6,8,0.86) 70%, rgba(5,6,8,0) 100%);
  backdrop-filter:blur(14px);
}
.topbar::after{
  content:''; position:absolute; bottom:0; left:0; width:100%; height:2px;
  background:linear-gradient(90deg, rgba(230,0,58,0) 0%, var(--c-red) 25%, var(--c-gold) 75%, rgba(207,168,96,0) 100%);
  background-size:200% 100%;
  box-shadow:0 0 15px var(--c-red);
  animation:laserScan 3.5s infinite linear;
}
@keyframes laserScan{ 0%{ background-position:-100% 0; } 100%{ background-position:200% 0; } }

.topbar-left{ display:flex; align-items:center; gap:18px; }
.hamburger{
  display:none; flex-direction:column; gap:5px; width:36px; height:36px;
  align-items:center; justify-content:center; border:1px solid var(--border-glass-strong);
  border-radius:4px; background:var(--c-black-3);
}
.hamburger span{ width:18px; height:2px; background:var(--c-white); transition:.3s var(--ease); }
.hamburger.active span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.hamburger.active span:nth-child(2){ opacity:0; }
.hamburger.active span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

.logo-link{ display:flex; align-items:center; gap:16px; transition:.4s var(--ease-bounce); }
.logo-link:hover .logo-img{ transform:scale(1.1) rotate(10deg); box-shadow:0 0 32px var(--c-gold-glow); }
.logo-img{
  width:58px; height:58px; border-radius:50%;
  object-fit:cover; padding:2px;
  background:linear-gradient(var(--c-black),var(--c-black)) padding-box,
             linear-gradient(90deg,var(--c-red),var(--c-gold)) border-box;
  border:2px solid transparent;
  box-shadow:0 0 22px var(--c-red-glow);
  transition:.4s var(--ease-bounce);
}
.logo-text{ display:flex; flex-direction:column; line-height:1.15; }
.logo-text b{
  font-family:var(--font-display); font-weight:900; font-size:1.32rem; letter-spacing:1.5px;
  text-transform:uppercase;
  background:linear-gradient(135deg,#fff 30%,var(--c-gold) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.logo-text small{
  font-family:var(--font-ui); font-size:.62rem; letter-spacing:4px; color:var(--c-red);
  text-transform:uppercase; font-weight:700; text-shadow:0 0 10px var(--c-red-glow);
}

.topbar-right{ display:flex; align-items:center; gap:16px; }
.topbar-social{ display:flex; gap:10px; }
.topbar-social a{
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,0.05); border:1px solid var(--border-glass-strong);
  color:var(--c-white); transition:.4s var(--ease-bounce);
}
.topbar-social a:hover{
  background:var(--c-red); border-color:var(--c-red);
  transform:scale(1.15) translateY(-4px); box-shadow:0 10px 20px var(--c-red-glow);
}

.btn{
  font-family:var(--font-ui); text-transform:uppercase; letter-spacing:2px;
  font-size:.76rem; font-weight:700; padding:13px 26px;
  color:var(--c-white); background:rgba(20,23,31,0.85);
  border:1px solid transparent;
  clip-path:polygon(0% 0%, 92% 0%, 100% 35%, 100% 100%, 8% 100%, 0% 65%);
  position:relative; overflow:hidden; transition:.4s var(--ease);
  display:inline-flex; align-items:center; gap:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.03), 0 5px 15px rgba(0,0,0,0.4);
}
.btn::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,var(--c-red),var(--c-gold));
  clip-path:polygon(0% 0%, 92% 0%, 100% 35%, 100% 100%, 8% 100%, 0% 65%);
  z-index:-1; opacity:.12; transition:opacity .3s var(--ease);
}
.btn:hover{ color:#050608; transform:translateX(4px) scale(1.02); box-shadow:-8px 0 22px var(--c-gold-glow); border-color:var(--c-gold); }
.btn:hover::before{ opacity:1; background:linear-gradient(90deg,var(--c-gold) 0%, #fff 100%); }
.btn-primary{ border-color:rgba(230,0,58,0.5); }
.btn-primary::before{ background:linear-gradient(90deg,var(--c-red),var(--c-gold)); opacity:.22; }
.btn-primary:hover{ color:var(--c-white); box-shadow:-8px 0 22px var(--c-red-glow); }
.btn-primary:hover::before{ background:linear-gradient(90deg,var(--c-red),var(--c-red)); opacity:1; }
.btn-outline{ background:transparent; border-color:var(--border-glass-strong); color:var(--c-gray); }
.btn-outline:hover{ color:#050608; }
.btn-block{ width:100%; justify-content:center; }
.btn-sm{ padding:10px 18px; font-size:.68rem; }

.sidebar{
  position:fixed; top:var(--header-h); left:0; bottom:0; width:var(--sidebar-w);
  background:linear-gradient(180deg, var(--c-black-2), var(--c-black));
  border-right:1px solid var(--border-glass);
  overflow-y:auto; z-index:150; padding:26px 16px 90px 0;
  transition:transform .35s var(--ease);
}
.sidebar::-webkit-scrollbar{ width:4px; }

.side-group{ margin-bottom:24px; padding:0 0 0 18px; }
.side-group-title{
  font-family:var(--font-display); font-size:.68rem; letter-spacing:4px;
  text-transform:uppercase; color:var(--c-gold); padding-left:10px; font-weight:700;
  border-left:2px solid var(--c-gold); opacity:.85; margin-bottom:12px;
}
.side-link{
  display:flex; align-items:center; gap:13px; width:100%; height:48px;
  padding:0 18px; margin:6px 0;
  background:rgba(20,23,31,0.75);
  color:var(--c-white); font-family:var(--font-ui); font-size:.72rem; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase; position:relative;
  clip-path:polygon(0% 0%, 94% 0%, 100% 32%, 100% 100%, 6% 100%, 0% 68%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.02), 0 4px 12px rgba(0,0,0,0.4);
  transition:.4s var(--ease);
}
.side-link::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,var(--c-red),var(--c-gold));
  clip-path:polygon(0% 0%, 94% 0%, 100% 32%, 100% 100%, 6% 100%, 0% 68%);
  z-index:-1; opacity:.08; transition:opacity .3s var(--ease);
}
.side-link::after{
  content:''; position:absolute; left:0; top:0; width:3px; height:100%;
  background:var(--c-red); box-shadow:0 0 10px var(--c-red); transition:.3s var(--ease);
}
.side-link i{ width:16px; text-align:center; font-size:.85rem; opacity:.75; }
.side-link:hover, .side-link.active{
  color:#050608; background:linear-gradient(90deg,var(--c-gold) 0%, #fff 100%);
  transform:translateX(8px) scale(1.01); box-shadow:-8px 0 20px var(--c-gold-glow);
}
.side-link:hover::before, .side-link.active::before{ opacity:1; }
.side-link:hover::after, .side-link.active::after{ background:var(--c-black); height:55%; top:22%; box-shadow:none; }
.side-link .badge{
  margin-left:auto; background:var(--c-red); color:#fff; font-size:.58rem;
  padding:3px 8px; border-radius:10px; font-family:var(--font-ui);
}

.sidebar-footer{ padding:18px 0 18px 18px; border-top:1px solid var(--border-glass); margin-top:10px; }
.sidebar-footer p{ font-family:var(--font-ui); font-size:.7rem; color:var(--c-gray-dark); line-height:1.6; }

.sidebar-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65);
  z-index:140; backdrop-filter:blur(2px);
}

.main-content{
  margin-left:var(--sidebar-w); margin-top:var(--header-h);
  width:calc(100% - var(--sidebar-w)); position:relative; z-index:2;
  min-height:calc(100vh - var(--header-h));
}
.page-section{ display:none; padding:60px 50px 90px; animation:stageIn .6s var(--ease) forwards; }
.page-section.active{ display:block; }
@keyframes stageIn{
  0%{ opacity:0; transform:translateY(30px) scale(.98); filter:blur(8px); }
  100%{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}
.container{ max-width:1280px; margin:0 auto; }

.glass-card{
  background:var(--c-card);
  border:1px solid var(--border-glass);
  border-left:4px solid var(--c-red);
  border-radius:8px;
  position:relative; overflow:hidden;
  backdrop-filter:blur(10px);
  box-shadow:0 15px 35px rgba(0,0,0,0.5);
  transition:.4s var(--ease);
}
.glass-card::before{
  content:''; position:absolute; top:0; right:0; width:80px; height:80px;
  background:linear-gradient(45deg, transparent 50%, rgba(255,255,255,0.03) 50%);
  transition:.3s var(--ease);
}
.glass-card:hover{
  transform:translateY(-8px);
  border-left-color:var(--c-gold);
  background:var(--c-card-hover);
  box-shadow:0 25px 50px rgba(0,0,0,0.6), 0 0 20px rgba(207,168,96,0.15);
}
.glass-card:hover::before{ background:linear-gradient(45deg, transparent 50%, rgba(207,168,96,0.1) 50%); }

.hero{
  position:relative; min-height:88vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; gap:38px;
  padding:70px 46px; overflow:hidden; border-bottom:1px solid var(--border-glass);
}
.hero-bg-img{
  position:absolute; inset:0;
  background:url('https://drive.google.com/thumbnail?id=1QVwallkKtbrFILwOsWlv8zeuneFJ9DEl&sz=w1920') center/cover no-repeat;
  opacity:.16; filter:grayscale(.2) contrast(1.15);
}
.hero::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(5,6,8,0.3), var(--c-black) 94%);
}
.hero-content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:30px; max-width:920px; }
.hero-badge{
  display:inline-flex; align-items:center; gap:10px;
  background:rgba(230,0,58,0.15); border:1px solid var(--c-red); color:var(--c-white);
  padding:9px 26px; font-size:.7rem; font-family:var(--font-ui); font-weight:700;
  text-transform:uppercase; letter-spacing:4px; border-radius:30px;
  box-shadow:0 0 20px var(--c-red-glow), inset 0 0 10px rgba(230,0,58,0.2);
  animation:pulseBadge 2.2s infinite;
}
@keyframes pulseBadge{
  0%{ box-shadow:0 0 20px var(--c-red-glow); } 50%{ box-shadow:0 0 40px rgba(230,0,58,.8); } 100%{ box-shadow:0 0 20px var(--c-red-glow); }
}
.hero-title{
  font-family:var(--font-display); font-weight:900; font-size:clamp(2.6rem,6.5vw,5.4rem);
  line-height:1.08; letter-spacing:1px; text-transform:uppercase;
  text-shadow:0 10px 30px rgba(0,0,0,0.8);
}
.hero-title span{
  color:transparent; -webkit-text-stroke:1.5px var(--c-gold);
  background:linear-gradient(180deg,#fff 0%, var(--c-gold) 100%);
  -webkit-background-clip:text; background-clip:text;
  filter:drop-shadow(0 0 15px var(--c-gold-glow));
}
.hero-text{ color:var(--c-gray); font-family:var(--font-ui); max-width:620px; font-size:1.02rem; }
.hero-text em{ color:var(--c-gold); font-style:normal; }
.hero-actions{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; }

.next-event-panel{
  margin-top:-60px; position:relative; z-index:5;
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:26px;
  padding:36px; margin-bottom:64px; border-left:4px solid var(--c-gold);
  border-top:3px solid var(--c-red);
}
.nep-info h3{ font-size:1.4rem; margin-bottom:8px; font-family:var(--font-display); }
.nep-info p{ color:var(--c-gray); font-family:var(--font-ui); font-size:.88rem; }
.countdown{ display:flex; gap:14px; }
.cd-box{
  background:var(--c-black-3); border:1px solid var(--border-glass-strong);
  border-radius:6px; padding:16px 18px; text-align:center; min-width:70px;
}
.cd-box span{ display:block; font-family:var(--font-display); font-weight:900; font-size:2rem; color:var(--c-gold); text-shadow:0 0 15px var(--c-gold-glow); }
.cd-box small{ font-family:var(--font-ui); font-size:.6rem; color:var(--c-gray); text-transform:uppercase; letter-spacing:2px; }

.stats-row{
  margin:40px 0 10px; display:grid; grid-template-columns:repeat(4,1fr); gap:0;
  background:linear-gradient(90deg, rgba(20,23,31,0) 0%, rgba(20,23,31,0.9) 50%, rgba(20,23,31,0) 100%);
  padding:40px 0; border-top:1px solid var(--border-glass); border-bottom:1px solid var(--border-glass);
}
.stat-item{
  text-align:center; padding:0 20px; border-right:1px solid rgba(255,255,255,0.06);
  background:none; border-left:none; box-shadow:none; backdrop-filter:none; transition:transform .3s var(--ease);
}
.stat-item:last-child{ border-right:none; }
.stat-item:hover{ transform:translateY(-6px); background:none; box-shadow:none; }
.stat-item:hover::before{ background:none; }
.stat-item i{ font-size:1.6rem; color:var(--c-red); margin-bottom:10px; }
.stat-num{
  display:block; font-family:var(--font-display); font-weight:900; font-size:2.6rem; color:var(--c-gold);
  text-shadow:0 0 20px var(--c-gold-glow); line-height:1; margin-bottom:10px;
}
.stat-item small{ font-family:var(--font-ui); color:var(--c-gray); font-size:.68rem; text-transform:uppercase; letter-spacing:2.5px; font-weight:700; }

.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
.pillar-card{ padding:34px 28px; }
.pillar-card i{ font-size:1.9rem; color:var(--c-gold); margin-bottom:16px; }
.pillar-card h4{ font-family:var(--font-display); font-size:1.2rem; margin-bottom:10px; text-transform:uppercase; }
.pillar-card p{ font-family:var(--font-ui); color:var(--c-gray); font-size:.9rem; }

.about-grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:26px; }
.about-text, .about-values{ padding:36px; }
.about-text h3, .about-values h3{ font-family:var(--font-display); font-size:1.25rem; margin-bottom:12px; color:var(--c-gold); }
.about-text p{ color:var(--c-gray); }
.value-list li{ padding:10px 0; color:var(--c-gray); font-family:var(--font-ui); font-size:.9rem; border-bottom:1px dashed var(--border-glass); }
.value-list li i{ color:var(--c-red); margin-right:10px; }
.value-list li:last-child{ border-bottom:none; }

.news-card{ overflow:hidden; display:flex; flex-direction:column; padding:0; }
.news-img{ height:180px; overflow:hidden; }
.news-img img{ width:100%; height:100%; object-fit:cover; transition:.5s var(--ease); filter:brightness(.75) contrast(1.1); }
.news-card:hover .news-img img{ transform:scale(1.08); filter:brightness(1) contrast(1.1); }
.news-body{ padding:22px; flex:1; display:flex; flex-direction:column; }
.news-date{ font-family:var(--font-ui); color:var(--c-gold); font-size:.68rem; text-transform:uppercase; letter-spacing:2px; font-weight:700; margin-bottom:10px; }
.news-body h4{ font-family:var(--font-display); font-size:1.1rem; margin-bottom:12px; line-height:1.3; text-transform:uppercase; }
